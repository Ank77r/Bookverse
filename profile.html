<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKVERSE | Executive Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        bg: '#050505',
                        surface: '#0F0F0F',
                        glass: 'rgba(20, 20, 20, 0.7)',
                        border: '#1F1F1F',
                        gold: '#D4AF37',
                        goldDim: '#8A7020',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050505; color: #e5e5e5; overflow: hidden; }
        
        /* Custom Scrollbar */
        .scroller::-webkit-scrollbar { width: 5px; }
        .scroller::-webkit-scrollbar-track { background: transparent; }
        .scroller::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .scroller::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(18, 18, 18, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }
        .glass-card:hover {
            border-color: rgba(212, 175, 55, 0.3); /* Gold border on hover */
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Ambient Noise Texture */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0;
        }

        /* Smooth text rendering */
        * { -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 4. PRE-FLIGHT CHECK
        const { useState, useEffect, useMemo } = React;
        
        // Icon wrapper to ensure they render after React updates
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- MOCK DATA ---
        const USER_PROFILE = {
            name: "Alex Sterling",
            handle: "@alex_design",
            role: "Product Architect",
            bio: "Crafting digital experiences at the intersection of aesthetics and utility. Currently scaling BookVerse.",
            location: "San Francisco, CA",
            stats: { followers: 12400, following: 485, reads: 850200 }
        };

        const INITIAL_BOOKS = [
            { id: 1, title: "The Quantum Thief", category: "Sci-Fi", reads: "450k", status: "Published", image: "https://images.unsplash.com/photo-1614728853913-1e1208922c2d?auto=format&fit=crop&q=80&w=400" },
            { id: 2, title: "Grid Systems", category: "Design", reads: "1.2M", status: "Published", image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=400" },
            { id: 3, title: "Neon Nights", category: "Cyberpunk", reads: "12k", status: "Draft", image: "https://images.unsplash.com/photo-1555680202-c86f0e12f086?auto=format&fit=crop&q=80&w=400" },
            { id: 4, title: "Silent Echoes", category: "Thriller", reads: "89k", status: "Reading", image: "https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&q=80&w=400" },
            { id: 5, title: "Abstract Mind", category: "Philosophy", reads: "340k", status: "Published", image: "https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&q=80&w=400" },
            { id: 6, title: "Botanic Wars", category: "Fantasy", reads: "56k", status: "Published", image: "https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&q=80&w=400" }
        ];

        const NOTIFICATIONS = [
            { id: 1, text: "Sarah liked your post 'Grid Systems'", time: "2m ago" },
            { id: 2, text: "New milestone: 10k Followers!", time: "1h ago" },
            { id: 3, text: "System Update: Dashboard v2.0 live", time: "1d ago" }
        ];

        // --- COMPONENTS ---

        // A. The "Glass Dock" Sidebar (Unique Mechanism)
        const GlassDock = ({ activeTab, setActiveTab }) => {
            const menuItems = [
                { id: 'overview', icon: 'layout-grid', label: 'Overview' },
                { id: 'library', icon: 'library', label: 'Library' },
                { id: 'drafts', icon: 'pen-tool', label: 'Studio' },
                { id: 'analytics', icon: 'bar-chart-2', label: 'Analytics' },
                { id: 'settings', icon: 'settings', label: 'Settings' },
            ];

            return (
                <div className="fixed left-6 top-1/2 -translate-y-1/2 z-50 flex flex-col gap-6">
                    {/* Brand Orb */}
                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-gold to-yellow-600 flex items-center justify-center text-black font-serif font-bold text-xl shadow-[0_0_25px_rgba(212,175,55,0.4)]">
                        B
                    </div>

                    {/* Navigation Pill */}
                    <div className="glass-panel p-2 rounded-full flex flex-col gap-4 py-6">
                        {menuItems.map((item) => {
                            const isActive = activeTab === item.id;
                            return (
                                <div key={item.id} className="relative group px-1">
                                    <button 
                                        onClick={() => setActiveTab(item.id)}
                                        className={`p-3 rounded-full transition-all duration-300 relative z-10 ${isActive ? 'bg-white text-black shadow-lg' : 'text-gray-500 hover:text-white hover:bg-white/10'}`}
                                    >
                                        <Icon name={item.icon} size={20} />
                                    </button>
                                    
                                    {/* Tooltip popping out from right */}
                                    <span className="absolute left-16 top-1/2 -translate-y-1/2 px-3 py-1 bg-surface border border-border text-xs text-white rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none tracking-widest uppercase font-semibold">
                                        {item.label}
                                    </span>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        // B. Animated Stat Card
        const StatBadge = ({ value, label }) => (
            <div className="flex flex-col items-center justify-center p-4 min-w-[100px] border-r border-white/5 last:border-0">
                <span className="font-serif text-2xl text-white italic">{value}</span>
                <span className="text-[10px] text-gray-500 uppercase tracking-widest mt-1">{label}</span>
            </div>
        );

        // C. Book Card 
        const BookCard = ({ book }) => (
            <div className="glass-card rounded-xl overflow-hidden group cursor-pointer animate-slide-up relative">
                {/* Image Area */}
                <div className="relative aspect-[3/4] overflow-hidden">
                    <img src={book.image} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-all duration-700" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-60 group-hover:opacity-40 transition-opacity"></div>
                    
                    {/* Floating Badge */}
                    <div className="absolute top-3 left-3 px-2 py-1 bg-black/50 backdrop-blur border border-white/10 rounded text-[9px] uppercase tracking-wide text-white">
                        {book.category}
                    </div>

                    {/* Hover Actions */}
                    <div className="absolute inset-0 flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/40 backdrop-blur-sm">
                        <button className="px-4 py-2 bg-white text-black text-xs font-bold uppercase rounded-full hover:scale-105 transition-transform">Read</button>
                        <button className="p-2 bg-black/50 text-white rounded-full border border-white/20 hover:bg-white hover:text-black transition-colors"><Icon name="edit-2" size={14}/></button>
                    </div>
                </div>

                {/* Meta Area */}
                <div className="p-4 bg-surface border-t border-white/5">
                    <div className="flex justify-between items-start mb-2">
                        <h3 className="font-serif text-lg text-white group-hover:text-gold transition-colors leading-tight">{book.title}</h3>
                    </div>
                    <div className="flex justify-between items-center text-xs text-gray-500 font-mono">
                        <span>{book.status}</span>
                        <span className="flex items-center gap-1"><Icon name="eye" size={12}/> {book.reads}</span>
                    </div>
                </div>
            </div>
        );

        // --- MAIN APPLICATION ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [searchQuery, setSearchQuery] = useState('');
            const [isFollowing, setIsFollowing] = useState(false);
            const [followerCount, setFollowerCount] = useState(USER_PROFILE.stats.followers);
            const [notificationsOpen, setNotificationsOpen] = useState(false);
            const [sortBy, setSortBy] = useState('Newest');

            // Toggle Follow Logic
            const toggleFollow = () => {
                setIsFollowing(!isFollowing);
                setFollowerCount(prev => isFollowing ? prev - 1 : prev + 1);
            };

            // Formatting numbers (e.g. 12400 -> 12.4k)
            const formatNum = (num) => {
                return num >= 1000 ? (num / 1000).toFixed(1) + 'k' : num;
            };

            // Filtering Data
            const filteredBooks = useMemo(() => {
                let data = INITIAL_BOOKS;
                
                // Tab Filter
                if (activeTab === 'library') data = data.filter(b => b.status === 'Published' || b.status === 'Reading');
                if (activeTab === 'drafts') data = data.filter(b => b.status === 'Draft');

                // Search Filter
                if (searchQuery) {
                    data = data.filter(b => b.title.toLowerCase().includes(searchQuery.toLowerCase()) || b.category.toLowerCase().includes(searchQuery.toLowerCase()));
                }

                // Sort Filter
                if (sortBy === 'Popular') {
                    // Quick hack to sort by string "450k"
                    data = [...data].sort((a,b) => parseInt(b.reads) - parseInt(a.reads));
                } else {
                    data = [...data].sort((a,b) => b.id - a.id);
                }

                return data;
            }, [activeTab, searchQuery, sortBy]);

            // Render Content based on Tab
            const renderContent = () => {
                if (activeTab === 'analytics') {
                    return (
                        <div className="w-full h-96 glass-panel rounded-2xl flex flex-col items-center justify-center text-gray-500 animate-fade-in border border-dashed border-white/20">
                            <Icon name="bar-chart-2" size={48} className="mb-4 text-gold opacity-50" />
                            <h2 className="text-xl text-white font-serif mb-2">Analytics Engine</h2>
                            <p>Data visualization modules are initializing...</p>
                        </div>
                    );
                }
                
                if (activeTab === 'settings') {
                    return (
                        <div className="glass-panel rounded-2xl p-8 animate-fade-in max-w-2xl">
                            <h2 className="text-2xl font-serif text-white mb-6">System Settings</h2>
                            <div className="space-y-4">
                                <div className="flex justify-between items-center py-4 border-b border-white/10">
                                    <span>Profile Visibility</span>
                                    <div className="w-10 h-5 bg-green-500 rounded-full relative"><div className="absolute right-1 top-1 w-3 h-3 bg-white rounded-full"></div></div>
                                </div>
                                <div className="flex justify-between items-center py-4 border-b border-white/10">
                                    <span>Email Notifications</span>
                                    <div className="w-10 h-5 bg-gray-700 rounded-full relative"><div className="absolute left-1 top-1 w-3 h-3 bg-white rounded-full"></div></div>
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="animate-fade-in">
                        {/* Filters Bar */}
                        <div className="flex flex-wrap items-center justify-between mb-8 gap-4">
                            <h2 className="text-3xl font-serif text-white capitalize">{activeTab} <span className="text-gold">.</span></h2>
                            
                            <div className="flex items-center gap-3">
                                <span className="text-xs text-gray-500 uppercase tracking-widest mr-2">Sort By:</span>
                                {['Newest', 'Popular'].map(sort => (
                                    <button 
                                        key={sort}
                                        onClick={() => setSortBy(sort)}
                                        className={`px-3 py-1 rounded text-xs border transition-colors ${sortBy === sort ? 'bg-white text-black border-white' : 'text-gray-400 border-white/10 hover:border-white'}`}
                                    >
                                        {sort}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Grid */}
                        {filteredBooks.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredBooks.map(book => <BookCard key={book.id} book={book} />)}
                            </div>
                        ) : (
                            <div className="w-full py-20 flex flex-col items-center justify-center text-gray-600 border border-white/5 rounded-2xl bg-white/[0.02]">
                                <Icon name="search-x" size={32} className="mb-3"/>
                                <p>No results found for "{searchQuery}"</p>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="relative min-h-screen w-full pl-0 md:pl-28 bg-bg">
                    <div className="noise-overlay"></div>
                    
                    {/* Navigation */}
                    <div className="hidden md:block">
                        <GlassDock activeTab={activeTab} setActiveTab={setActiveTab} />
                    </div>

                    {/* Mobile Nav (Fallback) */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full glass-panel z-50 flex justify-around p-4 border-t border-white/10">
                        {['overview', 'library', 'drafts', 'settings'].map(id => (
                            <button key={id} onClick={() => setActiveTab(id)} className={activeTab === id ? 'text-gold' : 'text-gray-500'}>
                                <Icon name={id === 'overview' ? 'layout-grid' : id === 'library' ? 'library' : id === 'drafts' ? 'pen-tool' : 'settings'} />
                            </button>
                        ))}
                    </div>

                    {/* Main Content Area */}
                    <main className="relative z-10 flex flex-col h-screen overflow-y-auto scroller">
                        
                        {/* Top Header */}
                        <header className="sticky top-0 z-40 px-6 py-4 glass-panel border-b border-white/5 flex items-center justify-between">
                            {/* Search */}
                            <div className="relative group w-full max-w-md">
                                <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                                    <Icon name="search" size={16} className="text-gray-500 group-focus-within:text-gold transition-colors" />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="Search your universe..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full bg-black/20 border border-white/10 rounded-lg py-2 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-gold/50 transition-colors placeholder-gray-600"
                                />
                            </div>

                            {/* Actions */}
                            <div className="flex items-center gap-4 ml-4">
                                <button 
                                    className="relative p-2 text-gray-400 hover:text-white transition-colors"
                                    onClick={() => setNotificationsOpen(!notificationsOpen)}
                                >
                                    <Icon name="bell" size={20} />
                                    <span className="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                                </button>
                                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-gray-700 to-gray-600 border border-white/20">
                                    <img src="https://i.pravatar.cc/150?u=alex" alt="Profile" className="w-full h-full rounded-full opacity-80" />
                                </div>
                            </div>
                        </header>

                        {/* Notification Drawer (Conditional) */}
                        {notificationsOpen && (
                            <div className="absolute top-16 right-6 w-80 glass-panel rounded-xl z-50 animate-fade-in overflow-hidden">
                                <div className="p-4 border-b border-white/10 flex justify-between items-center">
                                    <h4 className="font-bold text-sm text-white">Notifications</h4>
                                    <button onClick={() => setNotificationsOpen(false)}><Icon name="x" size={14}/></button>
                                </div>
                                <ul>
                                    {NOTIFICATIONS.map(n => (
                                        <li key={n.id} className="p-4 hover:bg-white/5 border-b border-white/5 last:border-0 text-xs text-gray-300">
                                            <p className="mb-1 text-white">{n.text}</p>
                                            <span className="text-gray-500">{n.time}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}

                        {/* Scrollable Content */}
                        <div className="p-6 md:p-12 max-w-7xl mx-auto w-full pb-24">
                            
                            {/* Hero Section (Always Visible on Overview) */}
                            {activeTab === 'overview' && (
                                <section className="relative mb-16 animate-fade-in">
                                    <div className="absolute top-0 right-0 p-32 bg-gold/10 blur-[100px] rounded-full pointer-events-none"></div>
                                    
                                    <div className="flex flex-col md:flex-row items-end gap-8 relative z-10">
                                        {/* Avatar */}
                                        <div className="relative group">
                                            <div className="w-32 h-32 md:w-40 md:h-40 rounded-full border-2 border-white/10 p-1">
                                                <img src="https://i.pravatar.cc/300?u=alex" className="w-full h-full rounded-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" />
                                            </div>
                                            <div className="absolute bottom-2 right-2 bg-blue-500 text-white p-1 rounded-full border-4 border-bg">
                                                <Icon name="check" size={12} strokeWidth={4} />
                                            </div>
                                        </div>

                                        {/* Info */}
                                        <div className="flex-1 space-y-4">
                                            <div>
                                                <h1 className="text-5xl md:text-6xl font-serif text-white italic tracking-tight mb-2">{USER_PROFILE.name}</h1>
                                                <div className="flex items-center gap-2 text-gold text-sm font-mono uppercase tracking-widest">
                                                    <Icon name="terminal" size={14} />
                                                    {USER_PROFILE.role}
                                                </div>
                                            </div>
                                            <p className="text-gray-400 max-w-xl leading-relaxed">{USER_PROFILE.bio}</p>
                                        </div>

                                        {/* Action Buttons */}
                                        <div className="flex flex-col items-end gap-4">
                                            <div className="flex gap-4 glass-panel rounded-xl pr-4">
                                                <StatBadge value={formatNum(followerCount)} label="Followers" />
                                                <StatBadge value={formatNum(USER_PROFILE.stats.following)} label="Following" />
                                                <StatBadge value={formatNum(USER_PROFILE.stats.reads)} label="Reads" />
                                            </div>
                                            <button 
                                                onClick={toggleFollow}
                                                className={`px-8 py-3 rounded-full text-xs font-bold uppercase tracking-widest transition-all ${isFollowing ? 'bg-transparent border border-white/20 text-white' : 'bg-white text-black hover:bg-gold hover:text-black'}`}
                                            >
                                                {isFollowing ? 'Following' : 'Follow Author'}
                                            </button>
                                        </div>
                                    </div>
                                </section>
                            )}

                            {/* Dynamic Content */}
                            {renderContent()}

                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
